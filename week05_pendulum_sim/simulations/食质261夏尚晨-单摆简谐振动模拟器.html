<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆简谐振动模拟器</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a24;
    overflow: hidden;
    font-family: "Consolas", "Microsoft YaHei", monospace;
  }
  #stage {
    display: block;
    margin: 0 auto;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #7fdcff;
    font-size: 13px;
    line-height: 1.7;
    text-shadow: 0 0 8px rgba(0, 200, 255, 0.35);
    pointer-events: none;
  }
  #panel {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    max-width: 92vw;
    gap: 26px;
    padding: 14px 22px;
    background: rgba(26, 26, 36, 0.88);
    border: 1px solid rgba(127, 220, 255, 0.22);
    border-radius: 10px;
    box-shadow: 0 0 24px rgba(0, 140, 255, 0.15), inset 0 0 18px rgba(0, 140, 255, 0.05);
    color: #9ccbe8;
    font-size: 12px;
    user-select: none;
  }
  .ctrl {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 168px;
  }
  .ctrl label {
    display: flex;
    justify-content: space-between;
  }
  .ctrl label output {
    color: #7fdcff;
    text-shadow: 0 0 6px rgba(0, 200, 255, 0.35);
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #0d47a1, #2a4a6a);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4fc3f7;
    border: 1.5px solid #d8f6ff;
    box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4fc3f7;
    border: 1.5px solid #d8f6ff;
    box-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
    cursor: pointer;
  }
  #resetBtn {
    padding: 9px 18px;
    background: rgba(13, 71, 161, 0.55);
    color: #bfeaff;
    border: 1px solid rgba(127, 220, 255, 0.45);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: box-shadow 0.15s, background 0.15s;
  }
  #resetBtn:hover {
    background: rgba(21, 101, 191, 0.7);
    box-shadow: 0 0 14px rgba(0, 200, 255, 0.45);
  }
  #resetBtn:active {
    box-shadow: 0 0 6px rgba(0, 200, 255, 0.3) inset;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud"></div>
<div id="panel">
  <div class="ctrl">
    <label>摆长 L <output id="lenVal">200 px</output></label>
    <input type="range" id="lenSlider" min="100" max="350" step="1" value="200">
  </div>
  <div class="ctrl">
    <label>重力 g <output id="gVal">9.8</output></label>
    <input type="range" id="gSlider" min="1" max="25" step="0.1" value="9.8">
  </div>
  <div class="ctrl">
    <label>阻尼 c <output id="dampVal">0.000</output></label>
    <input type="range" id="dampSlider" min="0" max="0.010" step="0.0005" value="0">
  </div>
  <button id="resetBtn">重置摆动</button>
</div>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  const DPR = window.devicePixelRatio || 1;
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- 物理参数 ----
  const PX_PER_M = 100;          // 像素-米换算
  const THETA0 = 45 * Math.PI / 180;

  let L_PX = 200;                // 摆长 px (滑块可调)
  let G = 9.8;                   // 重力加速度 (滑块可调)
  let DAMP = 0;                  // 阻尼系数 0~0.010 (滑块可调)

  // 运动状态 (数值积分: 半隐式欧拉 + 子步)
  let theta = THETA0;
  let omega = 0;                 // 角速度 rad/s

  let simTime = 0;
  let lastTs = null;

  const TRAIL = [];
  const TRAIL_MAX = 90;

  // ---- 控制面板绑定 ----
  const lenSlider = document.getElementById('lenSlider');
  const gSlider = document.getElementById('gSlider');
  const dampSlider = document.getElementById('dampSlider');
  const lenVal = document.getElementById('lenVal');
  const gVal = document.getElementById('gVal');
  const dampVal = document.getElementById('dampVal');

  function syncPanel() {
    L_PX = Number(lenSlider.value);
    G = Number(gSlider.value);
    DAMP = Number(dampSlider.value);
    lenVal.textContent = L_PX + ' px';
    gVal.textContent = G.toFixed(1);
    dampVal.textContent = DAMP.toFixed(3);
  }
  lenSlider.addEventListener('input', syncPanel);
  gSlider.addEventListener('input', syncPanel);
  dampSlider.addEventListener('input', syncPanel);
  syncPanel();

  document.getElementById('resetBtn').addEventListener('click', function () {
    theta = THETA0;
    omega = 0;
    simTime = 0;
    TRAIL.length = 0;
  });

  function pivot() {
    return { x: W / 2, y: H * 0.22 };
  }

  function bobPos(th) {
    const p = pivot();
    return {
      x: p.x + L_PX * Math.sin(th),
      y: p.y + L_PX * Math.cos(th)
    };
  }

  function drawBackground() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    // 科技网格
    ctx.strokeStyle = 'rgba(127, 220, 255, 0.05)';
    ctx.lineWidth = 1;
    const grid = 40;
    ctx.beginPath();
    for (let x = 0.5; x < W; x += grid) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0.5; y < H; y += grid) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function drawCeiling(p) {
    ctx.strokeStyle = '#3a4a6a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(p.x - 80, p.y);
    ctx.lineTo(p.x + 80, p.y);
    ctx.stroke();

    // 斜线阴影
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(127, 220, 255, 0.25)';
    ctx.beginPath();
    for (let i = -80; i <= 70; i += 15) {
      ctx.moveTo(p.x + i, p.y);
      ctx.lineTo(p.x + i + 10, p.y - 12);
    }
    ctx.stroke();
  }

  function drawArcGuide(p) {
    ctx.strokeStyle = 'rgba(127, 220, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, L_PX, Math.PI / 2 - THETA0 - 0.05, Math.PI / 2 + THETA0 + 0.05);
    ctx.stroke();
    ctx.setLineDash([]);

    // 竖直参考线
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y + L_PX + 30);
    ctx.stroke();
  }

  function drawTrail() {
    for (let i = 0; i < TRAIL.length; i++) {
      const t = TRAIL[i];
      const a = (i / TRAIL.length) * 0.35;
      ctx.fillStyle = 'rgba(0, 200, 255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawString(p, b) {
    ctx.strokeStyle = '#9ab8d8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  function drawBob(b) {
    // 微弱发光光效: 外圈辉光
    const glow = ctx.createRadialGradient(b.x, b.y, 6, b.x, b.y, 46);
    glow.addColorStop(0, 'rgba(0, 220, 255, 0.45)');
    glow.addColorStop(0.5, 'rgba(0, 160, 255, 0.12)');
    glow.addColorStop(1, 'rgba(0, 120, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 46, 0, Math.PI * 2);
    ctx.fill();

    // 球体
    const ball = ctx.createRadialGradient(b.x - 5, b.y - 6, 2, b.x, b.y, 16);
    ball.addColorStop(0, '#d8f6ff');
    ball.addColorStop(0.4, '#4fc3f7');
    ball.addColorStop(1, '#0d47a1');
    ctx.fillStyle = ball;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(190, 240, 255, 0.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 支点
    ctx.fillStyle = '#7fdcff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function updateHud() {
    const deg = (theta * 180 / Math.PI).toFixed(1);
    const lM = L_PX / PX_PER_M;
    const vMs = Math.abs(omega) * lM;
    const T = 2 * Math.PI / Math.sqrt(G / lM);
    hud.innerHTML =
      '摆长 L = ' + lM.toFixed(2) + ' m (' + L_PX + ' px)<br>' +
      '重力 g = ' + G.toFixed(1) + ' m/s²<br>' +
      '阻尼 c = ' + DAMP.toFixed(3) + '<br>' +
      '周期 T ≈ ' + T.toFixed(3) + ' s<br>' +
      '角度 θ = ' + deg + '°<br>' +
      '线速度 v = ' + vMs.toFixed(2) + ' m/s<br>' +
      't = ' + simTime.toFixed(2) + ' s';
  }

  function step(dt) {
    // 半隐式欧拉, 固定子步保证不同帧率下物理一致
    const SUB = 4;
    const h = dt / SUB;
    const lM = L_PX / PX_PER_M;
    for (let i = 0; i < SUB; i++) {
      const alpha = -(G / lM) * Math.sin(theta);
      omega += alpha * h;
      theta += omega * h;
    }
    // 阻尼: 每 1/60s 按 (1-c) 衰减角速度, 与帧率无关
    if (DAMP > 0) omega *= Math.pow(1 - DAMP, dt * 60);
  }

  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05; // 防止切页后跳帧

    simTime += dt;
    step(dt);

    const p = pivot();
    const b = bobPos(theta);

    TRAIL.push({ x: b.x, y: b.y });
    if (TRAIL.length > TRAIL_MAX) TRAIL.shift();

    drawBackground();
    drawArcGuide(p);
    drawCeiling(p);
    drawTrail();
    drawString(p, b);
    drawBob(b);
    updateHud();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
